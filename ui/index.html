<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask TypeSafe Jev</title>
<style>
  :root {
    color-scheme: light;
    --surface: #f4f4f2;
    --card: #fcfcfb;
    --border: #e2e1dc;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #8a8985;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-soft: #9ec5f4;
    --track: #cde2fb;
    --good: #0ca30c;
    --critical: #d03b3b;
    --focus: #2a78d6;
    --radius: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #131312;
      --card: #1a1a19;
      --border: #2e2e2b;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --text-3: #7f7e78;
      --accent: #3987e5;
      --accent-soft: #256abf;
      --track: #0d366b;
      --critical: #e66767;
      --focus: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #131312; --card: #1a1a19; --border: #2e2e2b; --text: #ffffff; --text-2: #c3c2b7;
    --text-3: #7f7e78; --accent: #3987e5; --accent-soft: #256abf; --track: #0d366b; --critical: #e66767; --focus: #3987e5;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--surface);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, "PingFang SC", "PingFang TC", "Noto Sans CJK SC", "Noto Sans Thai", Thonburi, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 16px 48px;
  }
  header {
    max-width: 1120px; margin: 0 auto; padding: 22px 0 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header > div:not(.logo):not(.status):not(.lang) { flex: 1 1 200px; min-width: 0; }
  .logo { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  header h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  header .sub { color: var(--text-2); font-size: 13.5px; }
  .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--card); }
  .lang button { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 6px 10px; color: var(--text-2); }
  .lang button + button { border-left: 1px solid var(--border); }
  .lang button:hover { color: var(--text); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  header .status { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .dot.ok { background: var(--good); }
  .dot.busy { background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }

  main { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 20px; align-items: start; }
  main > * { min-width: 0; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } aside { order: 2; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card + .card { margin-top: 16px; }
  label.field { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 0 0 6px; letter-spacing: .01em; }
  label.field span.hint { font-weight: 400; color: var(--text-3); }
  textarea, input[type=text], select {
    width: 100%; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; resize: vertical;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
  textarea#question { min-height: 74px; font-size: 16px; }
  textarea#context { min-height: 96px; font-size: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }
  .stack > * + * { margin-top: 14px; }

  .preview { font-size: 13px; color: var(--text-2); min-height: 20px; margin-top: 8px; }
  .preview .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--track); color: var(--text); margin-right: 6px; }
  .preview .err { color: var(--critical); white-space: pre-wrap; }

  details { border-top: 1px dashed var(--border); padding-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--text-2); font-weight: 600; user-select: none; }
  details .stack { margin-top: 12px; }

  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button.primary {
    font: inherit; font-weight: 650; font-size: 15px; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 10px; padding: 11px 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  button.primary:disabled { opacity: .55; cursor: progress; }
  button.primary kbd { font: 600 11px var(--mono); background: rgba(255,255,255,.18); padding: 2px 6px; border-radius: 5px; }
  button.ghost { font: inherit; font-size: 13px; color: var(--text-2); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.ghost:hover { color: var(--text); border-color: var(--text-3); }
  .banner { background: var(--card); border: 1px solid var(--critical); color: var(--critical); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; font-size: 14px; }

  /* results */
  .result { display: grid; gap: 14px; }
  .result .q { color: var(--text-2); font-size: 14px; }
  .result .q b { color: var(--text); font-weight: 600; }
  .verdict { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero { font-size: 48px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
  .hero.word { font-size: 34px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); }
  .chip.yes { border-color: var(--good); color: var(--good); }
  .chip.no { border-color: var(--critical); color: var(--critical); }
  .chip.unsure { border-color: var(--text-3); }
  .chip .ic { font-size: 12px; }
  .meta { font-size: 12.5px; color: var(--text-3); display: flex; gap: 14px; flex-wrap: wrap; }

  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: visible; margin: 8px 0 4px; }
  .meter .fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .meter .tick { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--card); box-shadow: 0 0 0 1px var(--text-3); }
  .meter .marker { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 2px var(--card); transform: translateX(-2px); }
  .meter-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); }

  .bars { display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
  .bar .lab { grid-column: 1; grid-row: 1; font-size: 13.5px; display: flex; justify-content: space-between; gap: 10px; }
  .bar .lab .idx { color: var(--text-3); font-family: var(--mono); font-size: 12px; margin-right: 6px; }
  .bar .lab.win { font-weight: 650; }
  .bar .track { grid-column: 1; grid-row: 2; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar .track .fill { height: 100%; background: var(--accent-soft); border-radius: 0 4px 4px 0; }
  .bar.win .track .fill { background: var(--accent); }
  .bar .val { grid-column: 2; grid-row: 1 / span 2; font-family: var(--mono); font-size: 13px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .bar.win .val { color: var(--text); font-weight: 600; }

  .copybox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .copybox code { font: 12.5px var(--mono); color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; flex: 1 1 320px; white-space: pre-wrap; word-break: break-word; }

  /* history */
  aside h2 { font-size: 13px; font-weight: 650; color: var(--text-2); margin: 4px 0 10px; letter-spacing: .02em; text-transform: uppercase; }
  .hist { display: grid; gap: 8px; max-height: 78vh; overflow: auto; }
  .hist button { all: unset; display: block; box-sizing: border-box; min-width: 0; max-width: 100%; overflow: hidden; cursor: pointer; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); }
  .hist button:hover { border-color: var(--accent); }
  .hist .v { font-weight: 650; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .t { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .hist .d { font-size: 11px; color: var(--text-3); margin-top: 4px; font-family: var(--mono); }
  .empty { color: var(--text-3); font-size: 13px; }
  .notice { font-size: 12.5px; color: var(--text-2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px; background: var(--card); }
  .notice code { font-family: var(--mono); font-size: 12px; }
  .notice a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">J</div>
  <div>
    <h1 data-i18n="title">Ask TypeSafe Jev</h1>
    <div class="sub" data-i18n="subtitle">Yes/no, pick one, or how much — a calibrated answer, no prose.</div>
  </div>
  <div class="lang" role="group" aria-label="Language" id="lang">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="zh-Hans">简体</button>
    <button type="button" data-lang="zh-Hant">繁體</button>
    <button type="button" data-lang="th">ไทย</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">ready</span></div>
</header>

<main>
  <section>
    <form class="card stack" id="form" autocomplete="off">
      <div>
        <label class="field" for="question"><span data-i18n="qLabel">Question</span> <span class="hint" data-i18n="qHint">— one per line to ask several at once</span></label>
        <textarea id="question" data-i18n-ph="qPlaceholder"></textarea>
        <div class="preview" id="preview"></div>
      </div>
      <div>
        <label class="field" for="context"><span data-i18n="ctxLabel">Context</span> <span class="hint" data-i18n="ctxHint">— Jev sees only this, nothing else</span></label>
        <textarea id="context" data-i18n-ph="ctxPlaceholder"></textarea>
      </div>
      <div class="row">
        <div>
          <label class="field" for="contextFile" data-i18n="specLabel">Also include a saved decision spec</label>
          <select id="contextFile"><option value="" data-i18n="none">none</option></select>
        </div>
      </div>
      <details>
        <summary data-i18n="advanced">Advanced — force the shape, name the options or levels</summary>
        <div class="stack">
          <div class="row">
            <div>
              <label class="field" for="options"><span data-i18n="optLabel">Options</span> <span class="hint" data-i18n="optHint">comma-separated → pick one</span></label>
              <input type="text" id="options" data-i18n-ph="optPlaceholder">
            </div>
            <div>
              <label class="field" for="levels"><span data-i18n="lvlLabel">Levels</span> <span class="hint" data-i18n="lvlHint">2–10, low → high, describe situations</span></label>
              <input type="text" id="levels" data-i18n-ph="lvlPlaceholder">
            </div>
            <div style="flex: 0 1 160px">
              <label class="field" for="type" data-i18n="shapeLabel">Shape</label>
              <select id="type">
                <option value="" data-i18n="auto">auto-detect</option>
                <option value="noul" data-i18n="shape.noul">yes/no</option>
                <option value="choice" data-i18n="shape.choice">pick one</option>
                <option value="score" data-i18n="shape.score">how much</option>
              </select>
            </div>
          </div>
        </div>
      </details>
      <div class="actions">
        <button class="primary" id="ask" type="submit"><span data-i18n="ask">Ask TypeSafe Jev</span> <kbd>⌘↩</kbd></button>
        <button class="ghost" id="clear" type="button" data-i18n="clear">Clear</button>
        <span class="meta" id="usage"></span>
      </div>
    </form>

    <div id="error" class="banner" hidden></div>
    <div id="results"></div>
  </section>

  <aside>
    <div class="notice" id="notice" hidden></div>
    <h2 data-i18n="recent">Recent</h2>
    <div class="hist" id="history"></div>
  </aside>
</main>

<script>

      ready: 'พร้อม', asking: 'กำลังถาม Jev…', error: 'เกิดข้อผิดพลาด',
      qLabel: 'คำถาม', qHint: '— บรรทัดละหนึ่งคำถาม ถามหลายข้อพร้อมกันได้',
      qPlaceholder: 'ควรจ่ายเงินซื้อโทเคนนี้ไหม\nชาแบบไหนดีกว่ากัน: ชาดำ, ชาอู่หลง หรือ ชาเขียว\nการขึ้นโปรดักชันโดยไม่ทดสอบเสี่ยงแค่ไหน',
      previewDefault: 'พิมพ์คำถาม — Jev ตอบได้สามแบบ: <b>…ไหม</b>, <b>A หรือ B</b> และ <b>…เสี่ยง/ยากแค่ไหน</b>',
      ctxLabel: 'บริบท', ctxHint: '— Jev เห็นเฉพาะข้อมูลตรงนี้เท่านั้น',
      ctxPlaceholder: 'ข้อเท็จจริงที่สำคัญ: ใคร อะไร ข้อจำกัด กำหนดเวลา เคยลองอะไรมาแล้วบ้าง…',
      specLabel: 'แนบสเปกการตัดสินใจที่บันทึกไว้ด้วย', none: 'ไม่มี',
      advanced: 'ขั้นสูง — กำหนดรูปแบบคำถาม ระบุตัวเลือกหรือระดับ',
      optLabel: 'ตัวเลือก', optHint: 'คั่นด้วยจุลภาค → เลือกหนึ่ง', optPlaceholder: 'อีเมล, LinkedIn, โทรหา',
      lvlLabel: 'ระดับ', lvlHint: '2–10 ระดับ จากน้อยไปมาก บรรยายเป็นสถานการณ์', lvlPlaceholder: 'ยังไม่เริ่ม, ต้นแบบ, ใช้ได้แต่ยังหยาบ, ขัดเกลาแล้ว, ปล่อยแล้ว',
      shapeLabel: 'รูปแบบ', auto: 'ตรวจจับอัตโนมัติ',
      'shape.noul': 'ใช่/ไม่', 'shape.choice': 'เลือกหนึ่ง', 'shape.score': 'มากน้อย',
      ask: 'ถาม TypeSafe Jev', clear: 'ล้าง',
      levelsN: (n, a, b) => `${n} ระดับ: ${a} → ${b}`,
      pYes: 'ความน่าจะเป็นที่คำตอบคือ “ใช่”', yes: 'ใช่', no: 'ไม่', unsure: 'ไม่แน่ใจ',
      meterNo: '0 · ไม่', meterYes: 'ใช่ · 1', confidence: 'ความมั่นใจ', closeCall: 'สูสี',
      copy: 'คัดลอกให้ Claude', copied: 'คัดลอกแล้ว', copyFail: 'เลือกข้อความด้านบนด้วยตนเอง',
      recent: 'ล่าสุด', empty: 'ยังไม่มีคำถาม',
      notice: `<b>เดโมสาธารณะ</b> คำตอบมาจากโมเดล <code>jev-latest</code> ของ TypeSafe ผ่านคีย์ของเจ้าของเว็บ จึงจำกัดจำนวนครั้ง (ไม่กี่ครั้งต่อนาทีต่อผู้ใช้) คำถามของคุณไม่ถูกเก็บบนเซิร์ฟเวอร์ รายการ “ล่าสุด” อยู่ในเบราว์เซอร์นี้เท่านั้น ซอร์สโค้ด: ${SOURCE}`,
    },
  };
  let lang = 'en', T = STRINGS.en, lastOut = null, isPublic = false;

  function detectLang() {
    try { const saved = localStorage.getItem('askjev.lang'); if (STRINGS[saved]) return saved; } catch {}
    const nav = (navigator.language || 'en').toLowerCase();
    if (nav.startsWith('zh')) return /tw|hk|mo|hant/.test(nav) ? 'zh-Hant' : 'zh-Hans';
    if (nav.startsWith('th')) return 'th';
    return 'en';
  }

  function setLang(next) {
    lang = STRINGS[next] ? next : 'en'; T = STRINGS[lang];
    try { localStorage.setItem('askjev.lang', lang); } catch {}
    document.documentElement.lang = lang;
    document.title = T.title;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = T[el.dataset.i18n];
    for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = T[el.dataset.i18nPh];
    for (const b of els.lang.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    els.notice.innerHTML = T.notice; els.notice.hidden = !isPublic;
    if (!els.ask.disabled) setStatus(lastOut ? lastOut.model : T.ready, 'ok');
    schedulePreview();
    if (lastOut) renderAll(lastOut);
    loadHistory();
  }

  // Shape notes come from the server in English ("how much (default levels…) · th"); show them in the page language.
  function shapeLabel(note) {
    const base = note.split(' (')[0].split(' · ')[0];
    const key = { 'yes/no': 'noul', 'pick one': 'choice', 'how much': 'score', 'choice': 'choice', 'score': 'score' }[base] || 'noul';
    const tag = (note.match(/ · ([\w-]+)$/) || [])[1];
    return T['shape.' + key] + (tag ? ' · ' + tag : '');
  }

  // ---- plumbing -----------------------------------------------------------------
  function body() {
    return {
      questions: els.q.value.split('\n').map((s) => s.trim()).filter(Boolean),
      context: els.ctx.value.trim(),
      context_file: els.file.value,
      options: els.opt.value.trim(),
      levels: els.lvl.value.trim(),
      type: els.type.value,
    };
  }
  function setStatus(text, cls) { els.status.textContent = text; els.dot.className = 'dot ' + (cls || ''); }
  function showError(msg) { els.error.textContent = msg; els.error.hidden = !msg; }

  async function api(path, payload) {
    const res = await fetch(path, payload ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) } : undefined);
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ---- live preview of how each line will be asked ----------------------------
  let previewTimer;
  function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(preview, 350); }
  async function preview() {
    const b = body();
    if (!b.questions.length) { els.preview.innerHTML = T.previewDefault; return; }
    try {
      const { request } = await api('/api/preview', b);
      els.preview.innerHTML = Object.values(request.questions).map((tq, i) => {
        let extra = '';
        if (tq.type === 'choice') extra = Object.keys(tq.criteria).join(' · ');
        if (tq.type === 'score') extra = T.levelsN(tq.criteria.length, tq.criteria[0], tq.criteria[tq.criteria.length - 1]);
        return `<div><span class="tag">${esc(T['shape.' + tq.type])}</span>${b.questions.length > 1 ? `<b>Q${i + 1}</b> ` : ''}${esc(extra)}</div>`;
      }).join('');
    } catch (e) {
      els.preview.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  // ---- rendering an answer -------------------------------------------------------
  function cliLine(r) {   // stays English: it is the line the /jev skill and Claude read
    return `JEV: ${r.verdict}   <- "${r.question}"  [${r.shape}]` + (r.detail ? `\n     ${r.detail}` : '');
  }

  function renderNoul(r) {
    const p = r.answer.noul;
    const v = p >= YES ? ['yes', '✓', T.yes] : p <= NO ? ['no', '✕', T.no] : ['unsure', '?', T.unsure];
    return `
      <div class="verdict"><div class="hero">${f2(p)}</div>
        <span class="chip ${v[0]}"><span class="ic">${v[1]}</span>${esc(v[2])}</span>
        <span class="meta">${esc(T.pYes)}</span></div>
      <div>
        <div class="meter"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div>
          <div class="tick" style="left:${NO * 100}%"></div><div class="tick" style="left:${YES * 100}%"></div></div>
        <div class="meter-labels"><span>${esc(T.meterNo)}</span><span>0.30</span><span>0.70</span><span>${esc(T.meterYes)}</span></div>
      </div>`;
  }

  function confidenceChip(conf) {
    const close = conf < CLOSE;
    return `<span class="chip ${close ? 'unsure' : ''}">${close ? `<span class="ic">?</span>${esc(T.closeCall)} · ` : ''}${esc(T.confidence)} ${f2(conf)}</span>`;
  }

  function renderChoice(r) {
    const a = r.answer;
    const rows = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]);
    return `
      <div class="verdict"><div class="hero word">${esc(a.choice)}</div>
        <span class="chip">p ${f2(a.probabilities[a.choice])}</span>${confidenceChip(a.confidence)}</div>
      <div class="bars">${rows.map(([k, p]) => `
        <div class="bar ${k === a.choice ? 'win' : ''}">
          <div class="lab ${k === a.choice ? 'win' : ''}"><span>${esc(k)}</span></div>
          <div class="val">${f2(p)}</div>
          <div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div></div>
        </div>`).join('')}</div>`;
  }

  function renderScore(r) {
    const a = r.answer;
    const top = Object.keys(a.legend).length - 1;
    const nearest = String(Math.round(a.score));
    return `
      <div class="verdict"><div class="hero">${f2(a.score)}<span style="font-size:20px;color:var(--text-3);font-weight:500"> / ${top}</span></div>
        <span class="chip">≈ ${esc(a.legend[nearest])}</span>${confidenceChip(a.confidence)}</div>
      <div>
        <div class="meter"><div class="marker" style="left:${(a.score / top * 100).toFixed(1)}%"></div></div>
        <div class="meter-labels"><span>0 · ${esc(a.legend['0'])}</span><span>${top} · ${esc(a.legend[String(top)])}</span></div>
      </div>
      <div class="bars">${Object.keys(a.legend).map((i) => `
        <div class="bar ${i === nearest ? 'win' : ''}">
          <div class="lab ${i === nearest ? 'win' : ''}"><span><span class="idx">${i}</span>${esc(a.legend[i])}</span></div>
          <div class="val">${f2(a.probabilities[i])}</div>
          <div class="track"><div class="fill" style="width:${(a.probabilities[i] * 100).toFixed(1)}%"></div></div>
        </div>`).join('')}</div>`;
  }

  function renderResult(out, r, i) {
    const inner = r.answer.type === 'noul' ? renderNoul(r) : r.answer.type === 'choice' ? renderChoice(r) : renderScore(r);
    const line = cliLine(r);
    const card = document.createElement('article');
    card.className = 'card result';
    card.innerHTML = `
      <div class="q">${out.results.length > 1 ? `<b>Q${i + 1}</b> · ` : ''}<b>${esc(r.question)}</b></div>
      ${inner}
      <div class="copybox"><code>${esc(line)}</code><button class="ghost" type="button">${esc(T.copy)}</button></div>
      <div class="meta"><span>${esc(shapeLabel(r.shape))}</span><span>${esc(out.model)}</span></div>`;
    card.querySelector('button').addEventListener('click', async (ev) => {
      try { await navigator.clipboard.writeText(line); ev.target.textContent = T.copied; setTimeout(() => (ev.target.textContent = T.copy), 1400); }
      catch { ev.target.textContent = T.copyFail; }
    });
    return card;
  }
  function renderAll(out) { els.results.replaceChildren(...out.results.map((r, i) => renderResult(out, r, i))); }

  // ---- history ---------------------------------------------------------------------
  const LOCAL_HIST = 'askjev.hist';
  function localHistory() { try { return JSON.parse(localStorage.getItem(LOCAL_HIST) || '[]'); } catch { return []; } }
  function rememberLocally(out) {
    try {
      const rows = out.results.map((r) => ({ ts: new Date().toISOString(), model: out.model, question: r.question, shape: r.shape, state: out.state, answer: r.answer, verdict: r.verdict })).reverse();
      localStorage.setItem(LOCAL_HIST, JSON.stringify(rows.concat(localHistory()).slice(0, 40)));
    } catch {}
  }

  function shortVerdict(row) {
    const a = row.answer || {};
    if (a.type === 'noul') return a.noul >= YES ? T.yes : a.noul <= NO ? T.no : T.unsure;
    if (a.type === 'score') return `${f2(a.score)} / ${Object.keys(a.legend).length - 1} ≈ ${a.legend[String(Math.round(a.score))]}`;
    return row.verdict.split(' (')[0];
  }

  async function loadHistory() {
    try {
      let rows = await api('/api/history?n=40');
      if (!Array.isArray(rows)) {            // server keeps no log (public deployment): use this browser's list
        isPublic = !!rows.public; els.notice.hidden = !isPublic;
        rows = localHistory();
      }
      if (!rows.length) { els.history.innerHTML = `<div class="empty">${esc(T.empty)}</div>`; return; }
      els.history.innerHTML = '';
      for (const row of rows) {
        const b = document.createElement('button');
        b.type = 'button';
        const when = new Date(row.ts).toLocaleString(T.locale, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const v = shortVerdict(row);
        b.innerHTML = `<div class="v" title="${esc(v)}">${esc(v)}</div><div class="t" title="${esc(row.question)}">${esc(row.question)}</div>
                       <div class="d">${esc(when)} · ${esc(shapeLabel(row.shape))}</div>`;
        b.addEventListener('click', () => {
          els.q.value = row.question;
          const st = row.state || {};
          els.ctx.value = typeof st.notes === 'string' ? st.notes : (typeof st.context === 'string' && !st.context.startsWith('No specific context') ? st.context : '');
          schedulePreview(); els.q.focus(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        els.history.appendChild(b);
      }
    } catch (e) { els.history.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  // ---- ask ---------------------------------------------------------------------------
  async function ask(ev) {
    ev && ev.preventDefault();
    const b = body();
    if (!b.questions.length) { els.q.focus(); return; }
    showError('');
    els.ask.disabled = true; setStatus(T.asking, 'busy');
    const t0 = performance.now();
    try {
      const out = await api('/api/ask', b);
      lastOut = out; renderAll(out);
      els.usage.textContent = `${out.usage.input_tokens} in / ${out.usage.output_tokens} out · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
      setStatus(out.model, 'ok');
      try { localStorage.setItem('askjev.last', JSON.stringify({ q: b.questions.join('\n'), ctx: b.context })); } catch {}
      rememberLocally(out);
      loadHistory();
    } catch (e) {
      showError(e.message); setStatus(T.error, '');
    } finally { els.ask.disabled = false; }
  }

  // ---- wiring ------------------------------------------------------------------------
  $('form').addEventListener('submit', ask);
  document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask(e); });
  for (const el of [els.q, els.opt, els.lvl, els.type]) el.addEventListener('input', schedulePreview);
  els.clear.addEventListener('click', () => { els.q.value = ''; els.ctx.value = ''; els.opt.value = ''; els.lvl.value = ''; els.type.value = ''; els.file.value = ''; els.results.replaceChildren(); lastOut = null; showError(''); els.usage.textContent = ''; schedulePreview(); els.q.focus(); });
  els.lang.addEventListener('click', (e) => { const b = e.target.closest('button[data-lang]'); if (b) setLang(b.dataset.lang); });

  (async () => {
    try { const files = await api('/api/contexts'); if (!files.length) els.file.closest('.row').hidden = true; for (const f of files) { const o = document.createElement('option'); o.value = f; o.textContent = 'decisions/' + f; els.file.appendChild(o); } } catch {}
    try { const last = JSON.parse(localStorage.getItem('askjev.last') || 'null'); if (last) { els.q.value = last.q || ''; els.ctx.value = last.ctx || ''; } } catch {}
    setLang(detectLang());
  })();
})();
</script>
</body>
</html>
